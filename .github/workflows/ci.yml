name: ci

# paths filters so a server change does not rebuild the console targets and a
# language file change does not run everything twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The version comes from server/go.mod rather than a literal. It was a
      # literal, and it said 1.22 while the module said 1.25 and the password
      # hashing used crypto/pbkdf2 - which is 1.24 and later. Every Go job in this
      # file was failing on a version nobody had a reason to look at.
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # The generator is the language parity check: it refuses to emit a table when
      # a key is missing from any language, is empty, or uses a different
      # placeholder set than English.
      - name: generated files are current
        run: make gen-check
      - name: core and platform/common include no platform headers
        run: make core-isolation
      # The structures are the same size on a desktop, which is the part that goes
      # wrong: a 50 KiB frame is invisible here and a data abort on a console.
      - name: no oversized stack frames
        run: make stack-check
      # What the consoles trust is one file in the tree. Empty or truncated, every
      # https server comes back as tls_error, which reads as the server's fault.
      - name: the built in CA bundle is intact
        run: make ca-check
      - name: handlers match shared/openapi.yaml
        run: make spec-check
      - name: tools
        run: make tools-test

  core:
    name: core (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      # Sanitizers on: this is the only place the sync path runs where a bad
      # pointer produces a readable report instead of a console hang.
      - name: core tests
        run: make core-test CC=${{ matrix.cc }}
      # A longer mutation run than the default. The corpus and the seed are fixed,
      # so this is deterministic: raising the count reaches further into the same
      # sequence rather than making the job flaky.
      - name: mutation, longer
        run: make core-test CC=${{ matrix.cc }}
        env:
          DAEMOON_FUZZ_ITERS: 50000

  server:
    name: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The version comes from server/go.mod rather than a literal. It was a
      # literal, and it said 1.22 while the module said 1.25 and the password
      # hashing used crypto/pbkdf2 - which is 1.24 and later. Every Go job in this
      # file was failing on a version nobody had a reason to look at.
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: vet
        run: cd server && go vet ./...
      - name: test
        run: cd server && go test -race ./...
      # A short run on every push. The corpus in testdata carries the inputs that
      # already found something, so those are checked by `go test` regardless.
      - name: fuzz the package parsers
        run: |
          cd server
          go test -run xxx -fuzz FuzzParseManifest -fuzztime 30s ./internal/pkgfmt/
          go test -run xxx -fuzz FuzzInspect -fuzztime 30s ./internal/pkgfmt/
      - name: build
        run: make server

  e2e:
    name: end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The version comes from server/go.mod rather than a literal. It was a
      # literal, and it said 1.22 while the module said 1.25 and the password
      # hashing used crypto/pbkdf2 - which is 1.24 and later. Every Go job in this
      # file was failing on a version nobody had a reason to look at.
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # The real daemoonctl against the real daemoond. The unit suites each pass
      # against a stand in, and the two bugs this catches were only visible when
      # the actual binaries spoke to each other.
      - name: build daemoonctl
        run: make -C tools/cli ROOT=$PWD
      - name: end to end
        run: make e2e
