name: console

# devkitPro builds. Split out and filtered: they need a container image and they
# have nothing to say about a server change.
on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'platform/3ds/**'
      - 'platform/nx/**'
      - 'vendor/**'
      - 'shared/lang/**'
      - '.github/workflows/console.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'platform/3ds/**'
      - 'platform/nx/**'
      - 'vendor/**'
      - 'shared/lang/**'
      - '.github/workflows/console.yml'

jobs:
  3ds:
    name: 3ds (devkitARM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Built through docker/3ds.Dockerfile rather than the bare devkitPro image,
      # because a CIA needs makerom and bannertool and neither is in the devkitPro
      # repositories. The image pins both by checksum.
      - name: toolchain image
        run: docker build -f docker/3ds.Dockerfile -t daemoon-3ds:local .
      # A CIA is the build that matters: a 3dsx cannot reach another title's save
      # archive. See platform/3ds/CLAUDE.md.
      - name: build the cia
        run: make docker-cia
      - uses: actions/upload-artifact@v4
        with:
          name: daemoon-3ds-cia
          path: platform/3ds/daemoon.cia
          if-no-files-found: error

  nx:
    name: switch (devkitA64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: toolchain image
        run: docker build -f docker/nx.Dockerfile -t daemoon-nx:local .
      - name: build the nro
        run: make docker-nx
      - uses: actions/upload-artifact@v4
        with:
          name: daemoon-switch-nro
          path: platform/nx/daemoon.nro
          if-no-files-found: error
