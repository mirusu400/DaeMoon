name: nightly

# One prerelease, rebuilt whenever main moves, so there is always a current build of
# all four targets without cutting a version for it.
#
# The tag is `nightly` and it moves. That is deliberate: a tag per build would leave a
# release list nobody can read and a hundred tags to prune, and there is exactly one
# question this answers - "what does main build into right now".
#
# Versioned releases are a separate thing and are not automated. The root CLAUDE.md
# says they are prefixed per target (`3ds/v1.2.0`, `server/v2.1.0`), which is a
# decision a person makes.
on:
  push:
    branches: [main]
  # A backstop. If a push run failed for a reason that has since gone away - a
  # registry timeout is the usual one - the build comes back on its own rather than
  # waiting for the next commit.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  # The release.
  contents: write
  # The container image, pushed to this repository's own registry namespace.
  packages: write

concurrency:
  # One at a time. Two runs publishing to the same moving tag would race, and the
  # loser would leave a release holding half of one build and half of another.
  group: nightly
  # Queued rather than cancelled. Publishing deletes the release and recreates it, so
  # a run cancelled between those two leaves no nightly at all until the next push -
  # which is a worse outcome than a few minutes of waiting behind a build.
  cancel-in-progress: false

jobs:
  # Nothing is published that has not passed the same checks a pull request has to.
  # A nightly is the build people actually download, and "it is only a nightly" is how
  # a broken one gets published on purpose.
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: build daemoonctl
        run: make -C tools/cli ROOT=$PWD
      - name: everything CI runs except the console builds
        run: make check

  server:
    name: server (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # What somebody self hosting actually runs on. The SQLite driver is pure Go
          # and cross compiles without cgo, which is why this is a matrix rather than
          # one build and an apology.
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: arm,   goarm: '7' }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: |
          set -eux
          name="daemoond-${GOOS}-${GOARCH}${GOARM:+v$GOARM}"
          # An `if`, not `[ ... ] && ...`. Under `set -e` the second form exits the
          # whole script the moment the test is false, which here is every build that
          # is not Windows - that is to say, almost all of them.
          if [ "$GOOS" = windows ]; then
            name="$name.exe"
          fi
          mkdir -p out
          cd server
          # -trimpath so the binary does not carry this runner's directory layout,
          # and the version stamped in so a downloaded binary can say what it is.
          go build -trimpath \
            -ldflags "-s -w -X main.version=nightly-$(git rev-parse --short HEAD)" \
            -o "../out/$name" ./cmd/daemoond
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: out/*
          if-no-files-found: error

  image:
    name: container image
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # amd64 and arm64. The second is not a nicety: a t4g or any other Graviton
      # instance is arm64, and those are the cheapest thing this will be run on.
      #
      # No QEMU step, because nothing is emulated. The build stage runs natively and Go
      # cross compiles to the target - emulating an arm64 toolchain to produce an arm64
      # binary is slower and it does not even work: `go mod download` dies with exit 255
      # under QEMU.
      - name: build and push
        uses: docker/build-push-action@v6
        # This action uploads a build record as an extra `*.dockerbuild` artifact,
        # and publish downloads every artifact this run produced. That download
        # failed after five retries on both nightlies that got as far as trying,
        # taking a release down with it - so the whole publish job was lost to a
        # file nothing here reads. Nothing consumes the build record; the release
        # is assembled from the artifacts the jobs upload by name.
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: docker/server.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/daemoon-server:nightly
          build-args: VERSION=nightly-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Redeploys the self hosted instance, and only when this push actually touched
  # the backend - a push that only changed platform/3ds or docs would otherwise
  # restart a server running identical code.
  #
  # SSH from the (GitHub hosted) runner rather than a self hosted runner living on
  # the box itself: this repository is public, so a self hosted runner would let
  # any fork's pull request run arbitrary code with that runner's access. Pulling
  # the image this workflow just published and restarting compose over SSH needs
  # no code execution on the runner's side at all.
  deploy:
    name: deploy
    needs: image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: does this push touch the backend
        id: changed
        run: |
          set -eu
          before='${{ github.event.before }}'
          if [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
            # No usable previous commit to diff against (force push, first push
            # of a new branch) - deploy rather than guess.
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$before" "$GITHUB_SHA" \
               | grep -qE '^(server/|shared/|docker/server\.Dockerfile|compose\.yml|deploy/compose\.turnstile\.yml|\.github/workflows/nightly\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: deploy over ssh
        if: steps.changed.outputs.changed == 'true'
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          set -eu
          trap 'rm -f key.pem daemoon.env' EXIT

          # Both values are optional so a private self-hosted deployment keeps its
          # old behaviour. One without the other is always a mistake: the app also
          # refuses that configuration at startup, but catching it here avoids
          # replacing a healthy container with one that cannot start.
          if { [ -z "$TURNSTILE_SITE_KEY" ] && [ -n "$TURNSTILE_SECRET_KEY" ]; } || \
             { [ -n "$TURNSTILE_SITE_KEY" ] && [ -z "$TURNSTILE_SECRET_KEY" ]; }; then
            echo '::error::TURNSTILE_SITE_KEY and TURNSTILE_SECRET_KEY must both be set'
            exit 1
          fi

          install -m 600 /dev/null key.pem
          printf '%s' "$SSH_KEY" > key.pem
          umask 077
          {
            printf 'TURNSTILE_SITE_KEY=%s\n' "$TURNSTILE_SITE_KEY"
            printf 'TURNSTILE_SECRET_KEY=%s\n' "$TURNSTILE_SECRET_KEY"
          } > daemoon.env

          # The compose override carries only variable names. It leaves the host's
          # base compose file untouched; the values cross SSH in a mode-0600 file
          # and never enter the repository, image, or command line.
          scp -o StrictHostKeyChecking=accept-new -i key.pem \
            compose.yml "ubuntu@$HOST:daemoon-base.yml.new"
          scp -o StrictHostKeyChecking=accept-new -i key.pem \
            deploy/compose.turnstile.yml "ubuntu@$HOST:daemoon-compose.yml.new"
          scp -o StrictHostKeyChecking=accept-new -i key.pem \
            daemoon.env "ubuntu@$HOST:daemoon.env.new"
          ssh -o StrictHostKeyChecking=accept-new -i key.pem "ubuntu@$HOST" '
            set -eu
            sudo install -m 644 daemoon-base.yml.new /opt/daemoon/compose.repo.yml
            sudo install -m 644 daemoon-compose.yml.new /opt/daemoon/compose.turnstile.yml
            sudo install -m 600 daemoon.env.new /opt/daemoon/.env.turnstile
            rm -f daemoon-base.yml.new daemoon-compose.yml.new daemoon.env.new
            cd /opt/daemoon

            # Keep whichever legacy/default Compose filename the host already
            # uses. The checked-in base is only a fallback for a fresh host.
            if [ -f compose.yaml ]; then
              base=/opt/daemoon/compose.yaml
            elif [ -f compose.yml ]; then
              base=/opt/daemoon/compose.yml
            elif [ -f docker-compose.yaml ]; then
              base=/opt/daemoon/docker-compose.yaml
            elif [ -f docker-compose.yml ]; then
              base=/opt/daemoon/docker-compose.yml
            else
              base=/opt/daemoon/compose.repo.yml
            fi

            override=
            case "$(basename "$base")" in
              compose.*)
                if [ -f compose.override.yaml ]; then
                  override=/opt/daemoon/compose.override.yaml
                elif [ -f compose.override.yml ]; then
                  override=/opt/daemoon/compose.override.yml
                fi
                ;;
              *)
                if [ -f docker-compose.override.yaml ]; then
                  override=/opt/daemoon/docker-compose.override.yaml
                elif [ -f docker-compose.override.yml ]; then
                  override=/opt/daemoon/docker-compose.override.yml
                fi
                ;;
            esac

            # Passing -f disables automatic override loading, so append the
            # detected production override before the Turnstile overlay.
            compose_cli() {
              if [ -f /opt/daemoon/.env ]; then
                sudo docker compose --env-file /opt/daemoon/.env \
                  --env-file /opt/daemoon/.env.turnstile "$@"
              else
                sudo docker compose --env-file /opt/daemoon/.env.turnstile "$@"
              fi
            }
            compose() {
              if [ -n "$override" ]; then
                compose_cli -f "$base" -f "$override" \
                  -f /opt/daemoon/compose.turnstile.yml "$@"
              else
                compose_cli -f "$base" \
                  -f /opt/daemoon/compose.turnstile.yml "$@"
              fi
            }
            compose pull daemoond
            compose up -d --no-deps daemoond

            # "Container Started" only means Docker ran the entrypoint. A bad
            # configuration can make the process exit one line later, which used
            # to leave this job green and the public site returning 502.
            healthy=false
            for attempt in $(seq 1 15); do
              if curl --fail --silent --show-error --max-time 5 \
                   http://127.0.0.1:8080/healthz; then
                healthy=true
                break
              fi
              sleep 2
            done
            if [ "$healthy" != true ]; then
              compose ps
              compose logs --tail 100 daemoond
              exit 1
            fi
            sudo docker image prune -f
          '

          # The daemon can be healthy on localhost while a production-only proxy
          # network is missing. Verify the path users actually reach as well.
          healthy=false
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --max-time 5 \
                 https://daemoon.mir.sh/healthz; then
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "$healthy" != true ]; then
            echo '::error::Public health check failed for https://daemoon.mir.sh/healthz'
            exit 1
          fi

  # A job id may not start with a digit, so this is `_3ds`, not `3ds`.
  _3ds:
    name: 3ds cia
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: toolchain image
        run: docker build -f docker/3ds.Dockerfile -t daemoon-3ds:local .
      # The stamp is what tells two builds apart in a bug report, and a commit alone
      # is not enough: two builds from the same dirty tree carried the same stamp
      # once and a survey could not be attributed to either.
      - name: build the cia
        run: make docker-cia
      - name: check the cia permissions
        run: |
          docker build -f docker/ctrtool.Dockerfile -t daemoon-ctrtool:local .
          make cia-verify
      - uses: actions/upload-artifact@v4
        with:
          name: cia
          path: platform/3ds/daemoon.cia
          if-no-files-found: error

  nx:
    name: switch nro
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: toolchain image
        run: docker build -f docker/nx.Dockerfile -t daemoon-nx:local .
      - name: build the nro
        run: make docker-nx
      - uses: actions/upload-artifact@v4
        with:
          name: nro
          path: platform/nx/daemoon.nro
          if-no-files-found: error

  publish:
    name: publish
    needs: [server, image, _3ds, nx]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the notes below can list what changed since the
          # last nightly rather than saying nothing.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: collect
        id: collect
        run: |
          set -eu
          mkdir -p release
          short=$(git rev-parse --short HEAD)

          # Named after the commit. A file on somebody's disk a week later has to be
          # able to say which build it is, and "daemoon.cia" cannot.
          for path in $(find artifacts -type f | sort); do
            base=$(basename "$path")
            case "$base" in
              daemoon.cia) out="daemoon-3ds-$short.cia" ;;
              daemoon.nro) out="daemoon-switch-$short.nro" ;;
              *.exe)       out="${base%.exe}-$short.exe" ;;
              *)           out="$base-$short" ;;
            esac
            cp "$path" "release/$out"
          done

          ls -l release
          echo "short=$short" >> "$GITHUB_OUTPUT"
      # Checksums, in the release rather than only in the log. A console build that
      # writes to save data is not something to install from a file nobody can check.
      - name: checksums
        run: cd release && sha256sum * | tee SHA256SUMS
      - name: notes
        id: notes
        run: |
          set -eu
          {
            echo "Built from \`$(git rev-parse HEAD)\` on $(git log -1 --format=%cI)."
            echo
            echo "**This is a build of main, not a release.** It moves whenever main"
            echo "does. Every commit here passed \`make check\`, and the 3DS CIA had"
            echo "its exheader read back - but nothing here has been on a console"
            echo "unless the commit message says so."
            echo
            echo "| file | what |"
            echo "|---|---|"
            echo "| \`daemoon-3ds-*.cia\` | 3DS. Install with FBI. A CIA, because a 3dsx cannot reach another title's save archive. |"
            echo "| \`daemoon-switch-*.nro\` | Switch. Phase 6 MVP: nothing in it has been verified on hardware yet. |"
            echo "| \`daemoond-*\` | the server. One static binary plus one database file. |"
            echo
            echo "The server is also a container image, amd64 and arm64:"
            echo
            echo '```'
            echo "docker run -d -p 8080:8080 -v daemoon-data:/data \\"
            echo "  ghcr.io/${{ github.repository_owner }}/daemoon-server:nightly"
            echo '```'
            echo
            echo "Or \`docker compose up -d\` with the \`compose.yml\` in the repository."
            echo "| \`SHA256SUMS\` | check what you downloaded before installing something that writes to save data. |"
            echo
            echo "### Since the last nightly"
            echo
            prev=$(git rev-parse -q --verify refs/tags/nightly^{commit} 2>/dev/null || true)
            if [ -n "$prev" ] && [ "$prev" != "$(git rev-parse HEAD)" ]; then
              git log --no-merges --format='- %s (`%h`)' "$prev..HEAD" | head -40
            else
              echo "- nothing new, or no previous nightly to compare against"
            fi
          } > NOTES.md
          cat NOTES.md
      # The gh CLI rather than a third party action. It is already on the runner, and
      # this repository rejects dependencies by default - a step that uploads files to
      # an API this workflow is already authenticated against is not the place to make
      # an exception.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          short='${{ steps.collect.outputs.short }}'

          # Deleted and recreated rather than edited. `gh release edit` leaves the old
          # assets in place, so a build that stopped producing one of them would ship
          # a release holding a file from a week ago beside four from today.
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true

          # A prerelease, so "latest" keeps pointing at a version somebody chose.
          gh release create nightly \
            --title "nightly ($short)" \
            --notes-file NOTES.md \
            --prerelease \
            --target "$GITHUB_SHA" \
            release/*
