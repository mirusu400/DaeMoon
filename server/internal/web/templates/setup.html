{{template "head" .}}
<div class="brand"><span class="sq">大</span> DaeMoon</div>
<div class="card pad">
  <h1 style="font-size:1.2rem;margin-bottom:.5rem">Set up this instance</h1>
  <p class="t-mut" style="margin:0 0 1rem;font-size:.9rem">There is no account here yet.
  The first one is an administrator, and this page stops working once it exists.</p>
  <form class="stack" method="post" action="/setup">
    <label>Name<input type="text" name="username" autocomplete="username" autofocus></label>
    <label>Password<input type="password" name="password" autocomplete="new-password"></label>
    <span class="t-mut mono">At least 8 characters.</span>
    <button class="btn-key">Create the account</button>
  </form>
</div>
{{template "foot" .}}
